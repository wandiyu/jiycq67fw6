<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>le88rs04</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF8EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="久坐运动">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{ --bg:#FFF8EF; --ink:#1E1A2E; --muted:#8A8496; --c:#FF5A5F; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;padding:16px 20px 0}
  .screen.on{display:flex}
  h1,h2{font-weight:900;letter-spacing:.01em}

  /* start */
  .s-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:48px;padding-bottom:30px}
  .s-title{font-size:42px;background:linear-gradient(90deg,#FF5A5F,#FF8A00 45%,#8338EC);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gear{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:380px}
  .gear>div{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
  .gi{width:100%;aspect-ratio:1;border-radius:22px;display:grid;place-items:center}
  .gi svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .gear span{font-size:14px;font-weight:500}
  .gear .opt .gi{background:#fff!important;border:2.5px dashed #C9C2D3}
  .gear .opt .gi svg{stroke:#A59DB2}
  .gear .opt span{color:var(--muted)}
  .badge{position:absolute;top:-8px;right:-4px;background:var(--ink);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
  .s-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:-30px}

  /* player */
  .topbar{display:flex;align-items:center;gap:12px}
  .x{border:none;background:none;color:var(--muted);font-size:16px;padding:8px 4px;font-family:inherit;cursor:pointer}
  .bar{flex:1;height:8px;background:#EFE7DC;border-radius:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--c);border-radius:8px;transition:width .35s ease,background .35s}
  .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-weight:500}
  .pl{flex:1;display:flex;flex-direction:column;padding:12px 0 8px}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .head h2{font-size:28px;line-height:1.25}
  .opt-tag{font-size:13px;font-weight:700;color:#fff;background:var(--ink);padding:2px 10px;border-radius:99px}
  .side{background:var(--c);color:#fff;border-radius:99px;padding:5px 14px;font-size:16px;font-weight:700}
  .photo{margin:12px 0 0;background:#fff;border-radius:22px;overflow:hidden;display:flex;justify-content:center;box-shadow:0 0 0 3px var(--c);flex:none}
  .photo img{display:block;max-width:100%;max-height:27vh;object-fit:contain;transition:max-height .3s}
  .paused .photo img{max-height:34vh}

  .timer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-top:10px}
  .phase{font-size:34px;font-weight:900;color:var(--c);text-align:center;line-height:1.2}
  .phase.calm{color:var(--ink)}
  .sub{font-size:15px;color:var(--muted);min-height:1.4em;text-align:center}
  .ring{position:relative;width:min(48vw,210px);aspect-ratio:1;margin:4px 0}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:12}
  .ring .trk{stroke:#EFE7DC}
  .ring .prg{stroke:var(--c);stroke-linecap:round}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:900;font-variant-numeric:tabular-nums}
  .reps{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .reps small{font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}

  .detail{display:none;padding-top:16px}
  .paused .timer{display:none}
  .paused .detail{display:block}
  .dose{display:flex;gap:8px}
  .dose div{flex:1;text-align:center;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:14px;padding:8px 4px}
  .dose b{font-size:20px;font-weight:900;color:var(--c)}
  .dose span{font-size:13px;margin-left:2px;font-weight:500}
  ul.how{margin:14px 0 0;padding:0}
  ul.how li{list-style:none;position:relative;padding:0 0 8px 22px;font-size:18px;font-weight:500}
  ul.how li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:10px;border-radius:50%;background:var(--c)}
  .tip{font-size:14px;color:var(--muted)}
  .pausedlabel{display:inline-block;margin-top:12px;font-size:13px;color:var(--muted)}

  /* controls */
  .ctrl{position:sticky;bottom:0;background:linear-gradient(to bottom,rgba(255,248,239,0),var(--bg) 25%);
    padding:12px 20px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:26px}
  .cb{width:60px;height:60px;border-radius:50%;border:none;background:#fff;box-shadow:0 0 0 2px #EFE7DC inset;display:grid;place-items:center;cursor:pointer}
  .cb svg{width:24px;height:24px;fill:var(--ink)}
  .cb.main{width:84px;height:84px;background:var(--c);box-shadow:0 8px 22px -8px var(--c)}
  .cb.main svg{width:34px;height:34px;fill:#fff}
  .cb:active{transform:scale(.95)}

  /* center screens */
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:20px 8px 30px}
  .big{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#06D6A0,#3A86FF)}
  .big svg{width:54px;height:54px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .center h2{font-size:30px}
  .optcards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px;max-width:360px}
  .optcards div{min-width:96px;border-radius:20px;padding:14px 10px;color:#fff;font-weight:700;font-size:16px}
  .optcards small{display:block;font-weight:500;opacity:.85;font-size:12px}
  .nav{position:sticky;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
  .btn{flex:1;border:none;border-radius:20px;padding:18px 16px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;
    background:var(--c);color:#fff;box-shadow:0 6px 18px -6px var(--c)}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 2px #EFE7DC inset}
  .stack{flex-direction:column}
  #start .btn{background:linear-gradient(90deg,#FF5A5F,#FF8A00);box-shadow:0 8px 22px -8px #FF5A5F}



  .guide{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:-24px}
  .guide-l{font-size:13px;color:var(--muted);letter-spacing:.06em}
  .seg{display:flex;background:#fff;border-radius:99px;padding:4px;box-shadow:0 0 0 2px #EFE7DC inset;gap:2px}
  .seg button{border:none;background:none;font-family:inherit;font-size:16px;font-weight:700;color:var(--muted);padding:10px 22px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
  .seg button.on{background:linear-gradient(90deg,#8338EC,#3A86FF);color:#fff}
  .s-hint{margin-top:12px!important}

  .nav.two{gap:12px}
  .nav.two .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px}
  .nav.two .btn b{font-size:19px}
  .nav.two .btn small{font-size:12px;font-weight:500;opacity:.85}
  #start .btn.relaxbtn{background:linear-gradient(90deg,#14B8A6,#8B5CF6);box-shadow:0 8px 22px -8px #14B8A6}

  /* home v2 */
  #start{justify-content:center;gap:34px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  #start .s-title{text-align:center;margin-top:-10px}
  .modes{display:flex;flex-direction:column;gap:16px}
  .mode{border:none;border-radius:26px;padding:22px 20px 18px;color:#fff;font-family:inherit;text-align:left;cursor:pointer;
    background:linear-gradient(120deg,#FF5A5F,#FF8A00);box-shadow:0 10px 26px -10px #FF5A5F;display:flex;flex-direction:column;gap:14px}
  .mode.relax{background:linear-gradient(120deg,#14B8A6,#8B5CF6);box-shadow:0 10px 26px -10px #14B8A6}
  .mode:active{transform:scale(.98)}
  .mode-t{font-size:28px;font-weight:900;letter-spacing:.02em}
  .gear2{display:flex;gap:14px;flex-wrap:wrap}
  .gear2>span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500}
  .gear2 i{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center}
  .gear2 svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  .gear2 .o{opacity:.7} .gear2 .o i{background:none;border:2px dashed rgba(255,255,255,.7)}
  #start .guide{margin-top:0}
  .seg button{padding:10px 14px;font-size:15px}
</style>
</head>
<body>
<div class="app">

  <section class="screen on" id="start">
    <h1 class="s-title">久坐运动</h1>
    <div class="modes">
      <button class="mode" id="go">
        <span class="mode-t">核心运动</span>
        <span class="gear2">
          <span><i><svg viewBox="0 0 48 48"><rect x="6" y="17" width="36" height="14" rx="4"/><path d="M14 17v14M6 24h8"/></svg></i>瑜伽垫</span><span><i><svg viewBox="0 0 48 48"><ellipse cx="24" cy="24" rx="17" ry="11"/><ellipse cx="24" cy="24" rx="9" ry="5"/></svg></i>弹力带</span><span><i><svg viewBox="0 0 48 48"><path d="M9 18l15-8 15 8v12l-15 8-15-8z"/><path d="M9 18l15 8 15-8M24 26v12"/></svg></i>瑜伽砖</span><span class="o"><i><svg viewBox="0 0 48 48"><path d="M12 6v36"/><path d="M12 18h14a6 6 0 0 1 0 12H12"/><circle cx="36" cy="24" r="3"/></svg></i>固定点</span>
        </span>
      </button>
      <button class="mode relax" id="goRelax">
        <span class="mode-t">舒缓拉伸</span>
        <span class="gear2"><span><i><svg viewBox="0 0 48 48"><rect x="6" y="17" width="36" height="14" rx="4"/><path d="M14 17v14M6 24h8"/></svg></i>瑜伽垫</span></span>
      </button>
    </div>
    <div class="guide">
      <div class="seg" id="seg">
        <button data-m="detail">详细讲解</button><button data-m="simple">简单讲解</button><button data-m="none">无讲解</button>
      </div>
    </div>
  </section>

  <section class="screen" id="player">
    <div class="topbar">
      <button class="x" id="quit">✕</button>
      <div class="bar"><i id="barfill"></i></div>
      <div class="count" id="count"></div>
    </div>
    <div class="pl" id="pl">
      <div class="head"><h2 id="pName"></h2><span class="opt-tag" id="pOpt" hidden>可选</span><span class="side" id="pSide" hidden></span></div>
      <figure class="photo"><img id="pImg" alt=""></figure>
      <div class="timer">
        <div class="phase" id="tPhase"></div>
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="prg" id="tPrg" cx="60" cy="60" r="52"/></svg><div class="num" id="tNum"></div></div>
        <div class="reps" id="tReps"></div>
        <div class="sub" id="tSub"></div>
      </div>
      <div class="detail">
        <div class="dose" id="pDose"></div>
        <ul class="how" id="pHow"></ul>
        <div class="tip" id="pTip"></div>
        <span class="pausedlabel">已暂停 · 点 ▶ 继续</span>
      </div>
    </div>
    <div class="ctrl">
      <button class="cb" id="bPrev" aria-label="上一个"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="cb main" id="bPlay" aria-label="暂停"><svg viewBox="0 0 24 24" id="playIcon"></svg></button>
      <button class="cb" id="bNext" aria-label="下一个"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </section>

  <section class="screen" id="gate">
    <div class="center">
      <div class="big"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>基础部分完成</h2>
      <div class="optcards">
        <div style="background:#F4511E">划船<small>Rows</small></div>
        <div style="background:#0EA5E9">抗旋转推<small>Pallof Press</small></div>
      </div>
    </div>
    <div class="nav stack">
      <button class="btn" id="doopt" style="--c:#8338EC">继续可选动作</button>
      <button class="btn" id="gostretch" style="--c:#14B8A6">直接放松拉伸</button>
      <button class="btn ghost" id="skipopt">今天就到这里</button>
    </div>
  </section>

  <section class="screen" id="gate2">
    <div class="center">
      <div class="big"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>可选动作完成</h2>
      <div class="optcards">
        <div style="background:#14B8A6">婴儿式</div>
        <div style="background:#DB2777">扩胸</div>
        <div style="background:#0891B2">髋屈肌</div>
        <div style="background:#F43F5E">抱膝</div>
        <div style="background:#8B5CF6">四字</div>
      </div>
    </div>
    <div class="nav stack">
      <button class="btn" id="gostretch2" style="--c:#14B8A6">放松拉伸</button>
      <button class="btn ghost" id="skipstretch">今天就到这里</button>
    </div>
  </section>

  <section class="screen" id="done">
    <div class="center">
      <div class="big"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>完成啦！</h2>
    </div>
    <div class="nav"><button class="btn" id="restart" style="--c:#06D6A0">回到开始</button></div>
  </section>

</div>

  <div id="dbg" style="display:none;position:fixed;inset:0;z-index:99;background:#1E1A2E;color:#9ef;font:12px/1.5 ui-monospace,Menlo,monospace;padding:calc(16px + env(safe-area-inset-top)) 14px 20px;overflow:auto;white-space:pre-wrap;-webkit-user-select:text;user-select:text"></div>

let actx=null;

let speakToken=0;
const DBG=[]; function dbg(m){ try{ DBG.push(((performance.now()/1000)%1000).toFixed(1)+' '+m); if(DBG.length>80) DBG.shift(); }catch(e){} }

/* seconds per character, learned from this phone's real voice */
let RATE=0.25; try{ const r=parseFloat(localStorage.getItem('speechRate')); if(r>0.12&&r<0.6) RATE=r; }catch(e){}
function nchars(t){ return t.replace(/[，。、：·！？\s]/g,'').length; }
function learnRate(t, dur){
  const n=nchars(t); if(n<4 || dur<0.4) return;
  const r=dur/n; if(r<0.12||r>0.6) return;

function estSecs(t){ return nchars(t)*RATE + 0.4; }
/* cb: {onLastStart(), onDone()} — parts are spoken in order; onDone when the last one really ends */
function sayQueue(text, cb){
  const token=++speakToken;
  const parts=text.split(/(?<=[。！？])/).map(s=>s.trim()).filter(Boolean);
  try{
    speechSynthesis.cancel();
    UTT=[];
    parts.forEach((t,k)=>{
      const u=new SpeechSynthesisUtterance(t); applyVoice(u); UTT.push(u);
      let t0=0; const tag='#'+k+'/'+parts.length;
      u.onstart=()=>{ dbg('start '+tag); if(token!==speakToken) return; t0=performance.now(); if(k===parts.length-1 && cb.onLastStart) cb.onLastStart(t); };
      u.onend=()=>{ dbg('end '+tag+(t0?' '+((performance.now()-t0)/1000).toFixed(1)+'s':'')); if(token!==speakToken) return; if(t0) learnRate(t,(performance.now()-t0)/1000); if(k===parts.length-1) cb.onDone(t0); };

      speechSynthesis.speak(u);
    });
    dbg('queued '+parts.length+' est '+estSecs(text).toFixed(1)+'s rate '+RATE.toFixed(2));

}

function bell(f, t0=0, d=0.5, v=0.28){
  try{ if(!actx) return; const t=actx.currentTime+t0;
    [[1,'sine',1],[2,'triangle',0.25],[3,'sine',0.08]].forEach(([m,type,a])=>{
      const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f*m; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*a,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+d*(m===1?1:0.5)); o.start(t); o.stop(t+d+0.05);
    });
  }catch(e){}
}

/* ---------- plan ---------- */
const REST=3, SET_REST=30, PREP=3, CN=['零','一','二','三','四','五','六','七','八','九','十'];
function estSpeech(t){ return t.replace(/[，。、：·\s]/g,'').length*0.3 + 0.8; }

function stepSegs(k, first){
  const s=FLOW[k], prev=FLOW[k-1], segs=[];
  const reps=+s.dose[0][0], sets=+s.dose[s.dose.length-1][0], hold=s.pace||s.stretch?0:+(s.dose[1]||[0])[0];
  // intro
  let text, pos;
  if (s.sideNo===1){ text=`换另一侧，${s.side}`; pos=0; }
  else {
    const cues = GUIDE==='detail' ? (s.detail||s.how) : GUIDE==='simple' ? s.how : [];
    text = (first?'开始。':'下一个，') + s.zh + '。' + (s.side? s.side+'。':'') + (cues.length? cues.join('。')+'。' : '');
    pos = 0;
  }
  text = text.replace(/\s*\+\s*/g,'和').replace(/°/g,'度').replace(/：/g,'，').replace(/；/g,'。').replace(/\s+/g,'');
  segs.push({step:k, kind:'intro', t:s.sideNo===1?'换另一侧':'动作讲解', say:text, est:estSpeech(text), pos});
  segs.push({step:k, kind:'prep', t:'准备', sec:PREP, say:'准备'});
  if (s.stretch){
    segs.push({step:k, kind:'work', t:'保持拉伸', sec:s.stretch, say:'保持，慢慢放松', tick:true, stretchHold:true});
    segs.push({step:k, kind:'rest', t:'慢慢回来', sec:3, say:'好，慢慢回来'});
    return segs;
  }
  for(let st=1; st<=sets; st++){
    for(let r=1; r<=reps; r++){
      const info={rep:r, reps, set:st, sets};
      const n = reps - r + 1;   // count down: 10, 9, 8 ...
      info.rem = n;
      if (s.phases) s.phases.forEach((ph,j)=>segs.push({step:k, kind:ph.kind||'work', t:ph.t, sec:ph.sec, say:(j===0?`${n}，`:'')+ph.say, tick:!!ph.tick, ...info}));
      else if (s.pace) segs.push({step:k, kind:'work', t:'推出 · 收回', sec:s.pace, say:`${r}`, ...info});
      else if (s.cue){
        const c=s.cue;
        const core = c.w==='收紧核心' ? '' : '，收紧核心';
        segs.push({step:k, kind:'work', t:c.w==='收紧核心'?'收紧核心':`${c.w} · 收紧核心`, sec:hold, say:`${n}，${c.w}${core}`, tick:true, ...info});
        segs.push({step:k, kind:'rest', t:c.r==='放松'?'放松':`${c.r} · 放松`, sec:REST, say:c.r==='放松'?'放松':`${c.r}，放松`, ...info});
      }
      else {
        segs.push({step:k, kind:'work', t:'保持', sec:hold, say:`${n}，保持`, tick:true, ...info});
        if (r<reps) segs.push({step:k, kind:'rest', t:'放松', sec:REST, say:'放松', ...info});
      }
    }
    if (st<sets) segs.push({step:k, kind:'rest', t:'组间休息', sec:SET_REST, say:(s.setRestSay||`第${CN[st]}组完成，休息${SET_REST}秒`), set:st, sets, setRest:true});
  }
  return segs;
}
function buildPlan(list){ let p=[]; list.forEach((k,i)=>{ p=p.concat(stepSegs(k, i===0)); }); return p; }

function enterSeg(resume){

    const lastText=parts[parts.length-1]||g.say;
    const now=()=>(performance.now()-P.segStart)/1000;

    P.introDeadline = 1e9;

    if ((g.setRest||g.stretchHold) && whole===10 && P.lastWhole!==-1) say('还有十秒');
    P.lastWhole=whole;
  }
  if (left<=0){ next(); if(!P.running) return; }
  P.raf=requestAnimationFrame(tick);
}
function next(){
  const cur=P.plan[P.idx]; P.idx++;
  if (P.idx>=P.plan.length){ endOfPlan(); return; }
  enterSeg(false);
}
function endOfPlan(){
  P.running=false; cancelAnimationFrame(P.raf);
  if (P.stage==='core'){ show('gate'); say('基础动作全部完成。可以做可选动作，或者直接放松拉伸。'); SND.done(); }
  else if (P.stage==='opt'){ show('gate2'); say('可选动作完成。要放松拉伸吗？'); SND.done(); }
  else finish();
}
function startStage(st){ unlockAudio(); keepAwake(); P.stage=st; startFrom(STAGES[st]); }
function finish(){
  P.running=false; cancelAnimationFrame(P.raf); release();
  show('done'); say('全部完成，辛苦了！'); SND.done();
}
function run(){ P.running=true; P.paused=false; setPlayIcon(); cancelAnimationFrame(P.raf); P.raf=requestAnimationFrame(tick); }
function pause(){
  if (!P.running) return;
  P.paused=true; cancelAnimationFrame(P.raf); hush();
  P.left=Math.max(0,P.sec-(performance.now()-P.segStart)/1000);
  $('pl').classList.add('paused'); setPlayIcon();
}
function resume(){
  $('pl').classList.remove('paused'); P.paused=false; keepAwake();
  const g=P.plan[P.idx];
  enterSeg(g.kind!=='intro');   // intro restarts (re-reads the instructions)
  run();
}
function setPlayIcon(){ $('playIcon').innerHTML = P.paused ? ICON_PLAY : ICON_PAUSE; $('bPlay').setAttribute('aria-label', P.paused?'继续':'暂停'); }
function jumpToStep(k){
  const j=P.plan.findIndex(g=>g.step===k);
  if (j<0) return;
  P.idx=j; $('pl').classList.remove('paused'); P.paused=false; enterSeg(false); run();
}
function startFrom(list){
  P.plan=buildPlan(list); P.idx=0; P.curStep=-1;
  show('player'); $('pl').classList.remove('paused');
  enterSeg(false); run();
}

/* ---------- buttons ---------- */
$('go').onclick=()=>startStage('core');
$('goRelax').onclick=()=>startStage('relax');
$('bPlay').onclick=()=>{ unlockAudio(); P.paused?resume():pause(); };
$('bNext').onclick=()=>{
  const L=STAGES[P.stage], i=L.indexOf(P.curStep);
  if (i+1 < L.length) jumpToStep(L[i+1]);
  else { P.idx=P.plan.length-1; hush(); endOfPlan(); }
};
$('bPrev').onclick=()=>{
  const g=P.plan[P.idx], first=P.plan.findIndex(x=>x.step===g.step);
  const startedLongAgo = P.idx-first>2;
  const L=STAGES[P.stage], i=L.indexOf(g.step);
  const target = startedLongAgo || i===0 ? g.step : L[i-1];
  jumpToStep(target);
};
$('quit').onclick=()=>{ P.running=false; cancelAnimationFrame(P.raf); hush(); release(); show('start'); };
$('doopt').onclick=()=>startStage('opt');
$('gostretch').onclick=()=>startStage('stretch');
$('skipopt').onclick=()=>finish();
$('gostretch2').onclick=()=>startStage('stretch');
$('skipstretch').onclick=()=>finish();
$('restart').onclick=()=>show('start');
(function(){ let n=0,t=0; const open=()=>{ const d=$('dbg'); d.textContent='诊断记录（截图发给 Claude，点任意处关闭）\n'+navigator.userAgent+'\nrate '+RATE.toFixed(3)+'\n\n'+DBG.join('\n'); d.style.display='block'; };
  $('dbg').onclick=()=>{ $('dbg').style.display='none'; };
  document.querySelectorAll('.s-title,#pName').forEach(el=>el.addEventListener('click',()=>{ const now=Date.now(); n = (now-t<600)? n+1 : 1; t=now; if(n>=5){ n=0; open(); } }));
})();
let GUIDE='detail'; try{ GUIDE=localStorage.getItem('guide')||'detail'; }catch(e){}
function renderSeg(){ document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.m===GUIDE)); }
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{ GUIDE=b.dataset.m; try{ localStorage.setItem('guide',GUIDE); }catch(e){} renderSeg(); });
renderSeg();

$('pImg').onclick=()=>{ if(P.running && !P.paused) pause(); };

document.addEventListener('visibilitychange',()=>{
  if (document.visibilityState==='hidden' && P.running && !P.paused) pause();
  if (document.visibilityState==='visible' && P.running) keepAwake();
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
